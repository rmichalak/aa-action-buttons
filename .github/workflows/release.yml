name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require release push token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "Missing RELEASE_TOKEN."
            echo "Create a fine-grained personal access token for this repository with Contents: Read and write."
            echo "Add it as the RELEASE_TOKEN Actions secret."
            echo "The release push runs as that token's owner. A personal account cannot exempt GitHub Actions from a ruleset."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release publishes only from the main branch (GITHUB_REF=$GITHUB_REF)."
            exit 1
          fi

      - name: Check version on main
        run: python3 scripts/release-version.py check

      - name: Install release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing. Refusing to sign a public release with the debug key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Test, lint, and assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon

      - name: Tag release
        run: |
          set -euo pipefail
          git tag "v${VERSION_NAME}"
          git push origin "v${VERSION_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          cp app/build/outputs/apk/release/app-release.apk "aa-action-buttons-${VERSION_NAME}.apk"
          gh release create "v${VERSION_NAME}" \
            "aa-action-buttons-${VERSION_NAME}.apk" \
            --verify-tag \
            --target "$sha" \
            --title "v${VERSION_NAME}" \
            --generate-notes

      - name: Bump version on main
        run: python3 scripts/release-version.py bump
