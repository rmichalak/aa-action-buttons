name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (semver x.y.z, for example 0.5.0)"
        required: true
        type: string
      version_code:
        description: "Android versionCode. Higher than version.properties for a new version; the current value tags the commit already on main."
        required: true
        type: number

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release publishes only from the main branch (GITHUB_REF=$GITHUB_REF)."
            exit 1
          fi

      - name: Validate release request
        id: validate
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import os
          import re
          import subprocess
          import sys

          version_name = os.environ.get("VERSION_NAME", "").strip()
          version_code_raw = os.environ.get("VERSION_CODE", "").strip()
          keystore_b64 = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          keystore_password = os.environ.get("ANDROID_KEYSTORE_PASSWORD", "")
          key_alias = os.environ.get("ANDROID_KEY_ALIAS", "")
          key_password = os.environ.get("ANDROID_KEY_PASSWORD", "")

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version_name):
              print(
                  f"version_name must match x.y.z with no v prefix or prerelease (got {version_name!r}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not re.fullmatch(r"[0-9]+", version_code_raw):
              print(
                  f"version_code must be an integer (got {version_code_raw!r}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          version_code = int(version_code_raw)

          current_code = None
          current_name = None
          try:
              with open("version.properties", encoding="utf-8") as fh:
                  for raw in fh:
                      line = raw.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      key = key.strip()
                      value = value.strip()
                      if key == "versionCode":
                          current_code = int(value)
                      elif key == "versionName":
                          current_name = value
          except OSError as exc:
              print(f"Could not read version.properties: {exc}", file=sys.stderr)
              sys.exit(1)
          except ValueError as exc:
              print(f"version.properties has an invalid versionCode: {exc}", file=sys.stderr)
              sys.exit(1)

          if current_code is None or current_name is None:
              print(
                  "version.properties must define versionCode and versionName.",
                  file=sys.stderr,
              )
              sys.exit(1)

          tag = f"v{version_name}"
          listed = subprocess.run(
              ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
              check=False,
              capture_output=True,
              text=True,
          )
          if listed.returncode != 0:
              print(listed.stderr.strip() or "git ls-remote failed.", file=sys.stderr)
              sys.exit(1)
          tag_exists = bool(listed.stdout.strip())

          release_exists = False
          if tag_exists:
              view = subprocess.run(
                  ["gh", "release", "view", tag],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if view.returncode == 0:
                  release_exists = True
              else:
                  details = f"{view.stdout}\n{view.stderr}".lower()
                  if "not found" not in details:
                      print(view.stderr.strip() or "gh release view failed.", file=sys.stderr)
                      sys.exit(1)

          if tag_exists and release_exists:
              print(f"GitHub Release {tag} is already published.", file=sys.stderr)
              sys.exit(1)

          if tag_exists:
              mode = "retry"
              mismatches = []
              if current_name != version_name:
                  mismatches.append(
                      f"versionName is {current_name}, expected {version_name}"
                  )
              if current_code != version_code:
                  mismatches.append(
                      f"versionCode is {current_code}, expected {version_code}"
                  )
              if mismatches:
                  print(
                      f"Tag {tag} exists without a GitHub Release, but version.properties does not match the request: "
                      + "; ".join(mismatches)
                      + ".",
                      file=sys.stderr,
                  )
                  sys.exit(1)
          elif current_name == version_name and current_code == version_code:
              # Version bump is already on main (or this is the first publish of the current version).
              mode = "publish"
          else:
              mode = "normal"
              problems = []
              if version_code <= current_code:
                  problems.append(
                      f"version_code {version_code} must be strictly greater than current versionCode {current_code}"
                  )
              if version_name == current_name:
                  problems.append(
                      f"version_name {version_name} must differ from current versionName {current_name}"
                  )
              if problems:
                  print("; ".join(problems) + ".", file=sys.stderr)
                  sys.exit(1)

          missing_secrets = [
              name
              for name, value in (
                  ("ANDROID_KEYSTORE_BASE64", keystore_b64),
                  ("ANDROID_KEYSTORE_PASSWORD", keystore_password),
                  ("ANDROID_KEY_ALIAS", key_alias),
                  ("ANDROID_KEY_PASSWORD", key_password),
              )
              if not value.strip()
          ]
          if missing_secrets:
              print(
                  "Missing release signing secrets: "
                  + ", ".join(missing_secrets)
                  + ". Refusing to sign a public release with the debug key.",
                  file=sys.stderr,
              )
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mode={mode}\n")
              out.write(f"version_name={version_name}\n")
              out.write(f"version_code={version_code}\n")
          print(f"Release mode: {mode} ({tag}, versionCode {version_code}).")
          PY

      - name: Write version.properties
        if: steps.validate.outputs.mode == 'normal'
        env:
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
        run: |
          python3 - << 'PY'
          import os
          import re
          import sys

          version_name = os.environ["VERSION_NAME"].strip()
          version_code = os.environ["VERSION_CODE"].strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version_name):
              print(f"Refusing to write version_name {version_name!r}.", file=sys.stderr)
              sys.exit(1)
          if not re.fullmatch(r"[0-9]+", version_code):
              print(f"Refusing to write version_code {version_code!r}.", file=sys.stderr)
              sys.exit(1)
          with open("version.properties", "w", encoding="utf-8") as fh:
              fh.write("# versionCode must increase on every Android release. versionName is the user-facing semver.\n")
              fh.write(f"versionCode={version_code}\n")
              fh.write(f"versionName={version_name}\n")
          PY

      - name: Install release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing. Refusing to sign a public release with the debug key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Test, lint, and assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest lintRelease assembleRelease --no-daemon

      - name: Commit and tag release
        if: steps.validate.outputs.mode == 'normal'
        env:
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to commit version_name '${VERSION_NAME}'." >&2
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "Refusing to commit version_code '${VERSION_CODE}'." >&2
            exit 1
          fi
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Release ${VERSION_NAME}" -m "versionCode ${VERSION_CODE}"
          git push origin HEAD:main
          git tag "v${VERSION_NAME}"
          git push origin "v${VERSION_NAME}"

      - name: Tag existing version
        if: steps.validate.outputs.mode == 'publish'
        env:
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to tag version_name '${VERSION_NAME}'." >&2
            exit 1
          fi
          git tag "v${VERSION_NAME}"
          git push origin "v${VERSION_NAME}"

      - name: Publish GitHub Release
        env:
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish version_name '${VERSION_NAME}'." >&2
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "aa-action-buttons-${VERSION_NAME}.apk"
          gh release create "v${VERSION_NAME}" \
            "aa-action-buttons-${VERSION_NAME}.apk" \
            --verify-tag \
            --target main \
            --title "v${VERSION_NAME}" \
            --generate-notes
